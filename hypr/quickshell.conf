# Quickshell desktop: start the shell and bind its keys (for hyprland.conf setups).
# install.sh puts this next to your hyprland.conf and adds
#   source = ~/.config/hypr/quickshell.conf
# Change any key you like; `hyprctl globalshortcuts` lists everything the shell offers.

exec-once = qs -n
exec-once = systemctl --user start hyprpolkitagent

# The shell's bar, wallpaper and panels animate themselves; Hyprland's own open
# animation on top would only make them appear later at login.
layerrule = no_anim on, match:namespace ^qs-

bind = SUPER, D, global, quickshell:launcher
bind = SUPER, N, global, quickshell:notifications
bind = SUPER, W, global, quickshell:network
bind = SUPER, A, global, quickshell:controls
bind = SUPER SHIFT, W, global, quickshell:wallpaper
bind = SUPER, Escape, global, quickshell:session

# Screenshots
bind = , Print, exec, qs ipc call screenshot region
bind = SHIFT, Print, exec, qs ipc call screenshot screen
bind = SUPER, Print, exec, qs ipc call screenshot window

# Volume and brightness keys. The pop-up shows whatever changes them, so if your
# config already binds these keys (to wpctl / brightnessctl) keep yours and leave
# these off — binding a key twice makes both fire.
# bindel = , XF86AudioRaiseVolume, global, quickshell:volumeUp
# bindel = , XF86AudioLowerVolume, global, quickshell:volumeDown
# bindl = , XF86AudioMute, global, quickshell:volumeMute
# bindl = , XF86AudioMicMute, global, quickshell:micMute
# bindel = , XF86MonBrightnessUp, global, quickshell:brightnessUp
# bindel = , XF86MonBrightnessDown, global, quickshell:brightnessDown
