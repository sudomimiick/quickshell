<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 224" width="400" height="448">
  <!-- An original little cat-eared hoodie kid, in the shell's soft lavender and dusty blue. -->
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5a7e1"/>
      <stop offset="1" stop-color="#8172bb"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cb2d8"/>
      <stop offset="1" stop-color="#647ead"/>
    </linearGradient>
    <radialGradient id="skin" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#f7ede5"/>
      <stop offset="1" stop-color="#e9d5c8"/>
    </radialGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#29233f"/>
      <stop offset="0.55" stop-color="#4f4783"/>
      <stop offset="1" stop-color="#9fd0c9"/>
    </linearGradient>
  </defs>

  <!-- hoodie body -->
  <path d="M62 150 Q100 140 138 150 L150 206 Q151 216 140 216 L60 216 Q49 216 50 206 Z" fill="url(#hood)"/>
  <!-- sleeves + paws -->
  <path d="M60 156 Q44 170 42 192 Q42 200 50 200 Q56 199 58 192 L64 168 Z" fill="url(#hood)"/>
  <path d="M140 156 Q156 170 158 192 Q158 200 150 200 Q144 199 142 192 L136 168 Z" fill="url(#hood)"/>
  <circle cx="50" cy="200" r="7" fill="#efdfd4"/>
  <circle cx="150" cy="200" r="7" fill="#efdfd4"/>
  <!-- pocket and drawstrings -->
  <path d="M78 186 Q100 180 122 186 L118 204 Q100 208 82 204 Z" fill="#5b75a5" opacity="0.55"/>
  <path d="M90 152 L88 172" stroke="#e4e9f3" stroke-width="3" stroke-linecap="round"/>
  <path d="M110 152 L112 172" stroke="#e4e9f3" stroke-width="3" stroke-linecap="round"/>
  <circle cx="88" cy="174" r="3.2" fill="#e4e9f3"/>
  <circle cx="112" cy="174" r="3.2" fill="#e4e9f3"/>

  <!-- hair, back -->
  <ellipse cx="100" cy="94" rx="76" ry="70" fill="url(#hair)"/>
  <!-- cat ears -->
  <path d="M38 52 Q44 14 60 8 Q70 6 84 36 Z" fill="url(#hair)"/>
  <path d="M162 52 Q156 14 140 8 Q130 6 116 36 Z" fill="url(#hair)"/>
  <path d="M50 44 Q54 24 62 20 Q68 20 74 38 Z" fill="#e2b6c6"/>
  <path d="M150 44 Q146 24 138 20 Q132 20 126 38 Z" fill="#e2b6c6"/>

  <!-- face -->
  <ellipse cx="100" cy="104" rx="60" ry="54" fill="url(#skin)"/>

  <!-- side locks -->
  <path d="M44 92 Q36 120 46 146 Q52 132 54 112 Z" fill="url(#hair)"/>
  <path d="M156 92 Q164 120 154 146 Q148 132 146 112 Z" fill="url(#hair)"/>

  <!-- bangs: five locks with pointed tips -->
  <path d="M38 98 C40 54 70 32 100 32 C130 32 160 54 162 98
           Q152 92 147 79 Q143 92 134 99
           Q126 90 123 75 Q118 90 110 97
           Q104 86 100 72 Q96 86 90 97
           Q82 90 77 75 Q74 92 66 99
           Q57 92 53 79 Q48 92 38 98 Z" fill="url(#hair)"/>
  <!-- shine on the hair -->
  <path d="M70 46 Q84 38 98 38" stroke="#e6dff6" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- eyes -->
  <ellipse cx="76" cy="112" rx="11.5" ry="14.5" fill="url(#iris)"/>
  <ellipse cx="124" cy="112" rx="11.5" ry="14.5" fill="url(#iris)"/>
  <circle cx="71.5" cy="105" r="4.6" fill="#ffffff"/>
  <circle cx="119.5" cy="105" r="4.6" fill="#ffffff"/>
  <circle cx="80" cy="118" r="2.1" fill="#ffffff" opacity="0.9"/>
  <circle cx="128" cy="118" r="2.1" fill="#ffffff" opacity="0.9"/>

  <!-- blush -->
  <ellipse cx="60" cy="130" rx="9" ry="5" fill="#e49cb0" opacity="0.5"/>
  <ellipse cx="140" cy="130" rx="9" ry="5" fill="#e49cb0" opacity="0.5"/>

  <!-- cat mouth -->
  <path d="M91 129 Q95.5 134 100 129 Q104.5 134 109 129" stroke="#7d4b58" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- star clip -->
  <path d="M142 50 L145.2 57.4 L153.2 58 L147 63.2 L149 71 L142 66.8 L135 71 L137 63.2 L130.8 58 L138.8 57.4 Z" fill="#ecd8a2" stroke="#c7a361" stroke-width="1.6" stroke-linejoin="round"/>
</svg>
